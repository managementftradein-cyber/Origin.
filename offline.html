<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1024">
<title>You're offline — The Christocentric Church</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(ellipse 70% 60% at 15% 0,rgba(21,94,239,.38),transparent 65%),radial-gradient(ellipse 60% 60% at 100% 100%,rgba(193,18,31,.32),transparent 65%),linear-gradient(165deg,#0d1838,#0a1024 55%,#14090e)}
  main{max-width:460px}
  img{width:116px;height:auto;margin:0 auto 26px;display:block;filter:drop-shadow(0 18px 28px rgba(0,0,0,.6))}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9dbbff;font-weight:700;margin-bottom:14px}
  h1{font:500 clamp(30px,8vw,42px)/1.12 Georgia,"Playfair Display",serif;margin-bottom:14px}
  p{color:#c8d3ee;line-height:1.7;font-size:15.5px;margin-bottom:26px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a,button{font:700 12px Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:14px 22px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;text-decoration:none;cursor:pointer}
  button{background:#C1121F;border-color:#C1121F}
  button:hover{background:#d9172a}
  a:hover{background:rgba(255,255,255,.1)}
  small{display:block;margin-top:30px;color:#8fa3d6;font-size:12.5px;line-height:1.6}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-emblem.png" alt="The Christocentric Church">
  <div class="eyebrow">No connection</div>
  <h1>You're offline right now.</h1>
  <p>We can't reach the internet. Pages you have already opened are still available. Check your connection and try again when you're ready.</p>
  <div class="row"><button type="button" onclick="location.reload()">Try again</button><a href="/">Go to Home</a></div>
  <small>"The Lord is my light and my salvation." The church is still here, and so is He.</small>
</main>
<script>addEventListener('online',function(){location.reload()})</script>
</body>
</html>
